<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Family Persatuan Pejuang Creator</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #0d1b2a;
      color: #e5e7eb;
      min-height: 100vh;
      padding-bottom: 90px;
    }

    header {
      background: #172b44;
      padding: 25px 20px;
      border-bottom: 1px solid #294867;
    }

    header h1 {
      font-size: 23px;
      margin-bottom: 10px;
    }

    header p {
      color: #cbd5e1;
      font-size: 15px;
    }

    .container {
      max-width: 700px;
      margin: auto;
      padding: 20px;
    }

    .welcome {
      background: #172b44;
      border: 1px solid #315a80;
      border-radius: 20px;
      padding: 20px;
      margin-bottom: 20px;
    }

    .welcome h2 {
      margin-bottom: 8px;
    }

    .cards {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
      margin-bottom: 22px;
    }

    .card {
      background: #172b44;
      border: 1px solid #315a80;
      border-radius: 20px;
      padding: 22px;
    }

    .card strong {
      display: block;
      font-size: 34px;
      color: #57d5f5;
      margin-bottom: 8px;
    }

    .card span {
      color: #b9c4d1;
      font-size: 16px;
    }

    .panel {
      background: #172b44;
      border: 1px solid #315a80;
      border-radius: 20px;
      padding: 20px;
      margin-bottom: 20px;
    }

    .panel h2 {
      margin-bottom: 18px;
    }

    input, select {
      width: 100%;
      padding: 15px;
      margin-bottom: 12px;
      border-radius: 12px;
      border: 1px solid #456b8e;
      background: #0d1b2a;
      color: white;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 12px;
      background: #18b8d8;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 5px;
    }

    button:active {
      transform: scale(.98);
    }

    .ranking-item,
    .history-item,
    .member-item {
      background: #0d1b2a;
      border: 1px solid #294867;
      padding: 15px;
      border-radius: 14px;
      margin-top: 10px;
    }

    .ranking-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .hidden {
      display: none;
    }

    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      background: #101f31;
      border-top: 1px solid #315a80;
      display: flex;
      justify-content: space-around;
      padding: 12px 5px;
    }

    .nav-btn {
      background: transparent;
      color: #b9c4d1;
      width: auto;
      margin: 0;
      padding: 8px 12px;
      font-size: 13px;
    }

    .nav-btn.active {
      color: #57d5f5;
    }

    .delete {
      background: #c0392b;
      margin-top: 10px;
    }

    .small {
      color: #9fb0c0;
      margin-top: 5px;
      font-size: 14px;
    }

    @media (max-width: 500px) {
      .cards {
        grid-template-columns: 1fr 1fr;
      }

      header h1 {
        font-size: 20px;
      }
    }
  </style>
</head>

<body>

<header>
  <h1>👑 FAMILY PERSATUAN PEJUANG CREATOR</h1>
  <p>🎥 LIVE • 💎 BERLIAN • 🏆 RANKING</p>
</header>

<div class="container">

  <!-- DASHBOARD -->
  <section id="dashboard">

    <div class="welcome">
      <h2>👋 Selamat Datang</h2>
      <p>Dashboard Family Persatuan Pejuang Creator</p>
    </div>

    <div class="cards">
      <div class="card">
        <strong id="totalAnggota">0</strong>
        <span>👥 Total Anggota</span>
      </div>

      <div class="card">
        <strong id="totalBerlian">0</strong>
        <span>💎 Total Berlian</span>
      </div>

      <div class="card">
        <strong id="totalLive">0</strong>
        <span>🎥 Total Live</span>
      </div>

      <div class="card">
        <strong id="totalJam">0</strong>
        <span>⏱️ Total Jam Live</span>
      </div>
    </div>

    <div class="panel">
      <h2>🏆 Ranking Berlian</h2>
      <div id="rankingDashboard"></div>
    </div>

  </section>


  <!-- CATAT LIVE -->
  <section id="catat" class="hidden">

    <div class="panel">
      <h2>🎥 Catat Live</h2>

      <select id="liveNama">
        <option value="">Pilih Anggota</option>
      </select>

      <input
        type="number"
        id="berlian"
        placeholder="Jumlah Berlian"
      >

      <input
        type="number"
        id="jamLive"
        placeholder="Jumlah Jam Live"
      >

      <button onclick="catatLive()">
        💾 Simpan Catatan Live
      </button>
    </div>

  </section>


  <!-- RIWAYAT -->
  <section id="riwayat" class="hidden">

    <div class="panel">
      <h2>📜 Riwayat Live</h2>
      <div id="riwayatList"></div>
    </div>

  </section>


  <!-- KELOLA -->
  <section id="kelola" class="hidden">

    <div class="panel">
      <h2>⚙️ Kelola Anggota</h2>

      <input
        type="text"
        id="namaAnggota"
        placeholder="Nama anggota"
      >

      <select id="roleAnggota">
        <option value="anggota">👤 Anggota</option>
        <option value="admin">🛡️ Admin</option>
        <option value="ketua">👑 Ketua</option>
      </select>

      <button onclick="tambahAnggota()">
        ➕ Tambah Anggota
      </button>
    </div>

    <div class="panel">
      <h2>👥 Daftar Anggota</h2>
      <div id="anggotaList"></div>
    </div>

  </section>

</div>


<nav class="bottom-nav">

  <button class="nav-btn active"
    onclick="bukaTab('dashboard', this)">
    💎<br>Dashboard
  </button>

  <button class="nav-btn"
    onclick="bukaTab('catat', this)">
    🎥<br>Catat Live
  </button>

  <button class="nav-btn"
    onclick="bukaTab('riwayat', this)">
    📜<br>Riwayat
  </button>

  <button class="nav-btn"
    onclick="bukaTab('kelola', this)">
    ⚙️<br>Kelola
  </button>

</nav>


<script>

let anggota =
  JSON.parse(localStorage.getItem("anggota")) || [];

let riwayat =
  JSON.parse(localStorage.getItem("riwayat")) || [];


function simpanData() {
  localStorage.setItem(
    "anggota",
    JSON.stringify(anggota)
  );

  localStorage.setItem(
    "riwayat",
    JSON.stringify(riwayat)
  );
}


function bukaTab(tab, tombol) {

  document.querySelectorAll("section")
    .forEach(item => {
      item.classList.add("hidden");
    });

  document.getElementById(tab)
    .classList.remove("hidden");

  document.querySelectorAll(".nav-btn")
    .forEach(btn => {
      btn.classList.remove("active");
    });

  tombol.classList.add("active");

  render();
}


function tambahAnggota() {

  const nama =
    document.getElementById("namaAnggota")
    .value.trim();

  const role =
    document.getElementById("roleAnggota")
    .value;

  if (!nama) {
    alert("Masukkan nama anggota!");
    return;
  }

  anggota.push({
    id: Date.now(),
    nama: nama,
    role: role,
    berlian: 0,
    jamLive: 0,
    jumlahLive: 0
  });

  document.getElementById("namaAnggota").value = "";

  simpanData();

  render();

  alert("Anggota berhasil ditambahkan!");
}


function hapusAnggota(id) {

  if (!confirm("Hapus anggota ini?")) return;

  anggota =
    anggota.filter(item => item.id !== id);

  simpanData();

  render();
}


function catatLive() {

  const id =
    Number(document.getElementById("liveNama").value);

  const berlian =
    Number(document.getElementById("berlian").value) || 0;

  const jam =
    Number(document.getElementById("jamLive").value) || 0;

  if (!id) {
    alert("Pilih anggota terlebih dahulu!");
    return;
  }

  const member =
    anggota.find(item => item.id === id);

  member.berlian += berlian;
  member.jamLive += jam;
  member.jumlahLive += 1;

  riwayat.unshift({
    id: Date.now(),
    nama: member.nama,
    berlian: berlian,
    jam: jam,
    waktu: new Date().toLocaleString("id-ID")
  });

  document.getElementById("berlian").value = "";
  document.getElementById("jamLive").value = "";

  simpanData();

  render();

  alert("Live berhasil dicatat!");
}


function render() {

  const totalBerlian =
    anggota.reduce(
      (total, item) =>
        total + Number(item.berlian),
      0
    );

  const totalJam =
    anggota.reduce(
      (total, item) =>
        total + Number(item.jamLive),
      0
    );

  const totalLive =
    anggota.reduce(
      (total, item) =>
        total + Number(item.jumlahLive),
      0
    );


  document.getElementById("totalAnggota")
    .textContent = anggota.length;

  document.getElementById("totalBerlian")
    .textContent = totalBerlian;

  document.getElementById("totalJam")
    .textContent = totalJam;

  document.getElementById("totalLive")
    .textContent = totalLive;


  const select =
    document.getElementById("liveNama");

  select.innerHTML =
    '<option value="">Pilih Anggota</option>';

  anggota.forEach(item => {

    select.innerHTML += `
      <option value="${item.id}">
        ${item.nama}
      </option>
    `;

  });


  const anggotaList =
    document.getElementById("anggotaList");

  anggotaList.innerHTML = "";

  anggota.forEach(item => {

    anggotaList.innerHTML += `
      <div class="member-item">

        <strong>${item.nama}</strong>

        <div class="small">
          ${item.role.toUpperCase()}
          • 💎 ${item.berlian}
          • 🎥 ${item.jumlahLive} Live
          • ⏱️ ${item.jamLive} Jam
        </div>

        <button
          class="delete"
          onclick="hapusAnggota(${item.id})">
          🗑️ Hapus
        </button>

      </div>
    `;

  });


  const ranking =
    [...anggota].sort(
      (a, b) =>
        Number(b.berlian) -
        Number(a.berlian)
    );


  const rankingDashboard =
    document.getElementById("rankingDashboard");

  rankingDashboard.innerHTML = "";

  if (ranking.length === 0) {

    rankingDashboard.innerHTML =
      "<p class='small'>Belum ada data ranking.</p>";

  } else {

    ranking.slice(0, 10)
      .forEach((item, index) => {

        rankingDashboard.innerHTML += `
          <div class="ranking-item">
            <strong>
              #${index + 1} ${item.nama}
            </strong>

            <span>
              💎 ${item.berlian}
            </span>
          </div>
        `;

      });

  }


  const riwayatList =
    document.getElementById("riwayatList");

  riwayatList.innerHTML = "";

  if (riwayat.length === 0) {

    riwayatList.innerHTML =
      "<p class='small'>Belum ada riwayat live.</p>";

  } else {

    riwayat.forEach(item => {

      riwayatList.innerHTML += `
        <div class="history-item">

          <strong>
            🎥 ${item.nama}
          </strong>

          <div class="small">
            💎 ${item.berlian} Berlian
            • ⏱️ ${item.jam} Jam
          </div>

          <div class="small">
            📅 ${item.waktu}
          </div>

        </div>
      `;

    });

  }

}


render();

</script>

</body>
</html>
